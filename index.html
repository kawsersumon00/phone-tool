<title>Phone Dealer Tool Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:linear-gradient(135deg,#11998e,#38ef7d);min-height:100vh;padding:12px;font-size:15px}
.box{background:#fff;max-width:520px;margin:0 auto;padding:20px 16px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
h1{text-align:center;font-size:20px;color:#222;margin-bottom:3px}
.sub{text-align:center;color:#888;font-size:12px;margin-bottom:18px}
label{display:block;margin-top:14px;margin-bottom:6px;font-weight:600;color:#333;font-size:14px}
input,select{width:100%;padding:13px 12px;border:2px solid #ddd;border-radius:12px;font-size:15px;background:#fff;-webkit-appearance:none;appearance:none}
input:focus,select:focus{border-color:#11998e;outline:none}
input:read-only{background:#f5f5f5}
button{width:100%;margin-top:20px;padding:16px;background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:bold;-webkit-appearance:none}
button:active{transform:scale(.98)}
.result{margin-top:20px;padding:16px;background:#f0fff4;border-radius:14px;border-left:5px solid #11998e;display:none}
.result.show{display:block}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #ddd;font-size:13px;gap:8px}
.label-txt{color:#666;flex:1}
.value{font-weight:bold;color:#222;text-align:right}
.hl{background:#d4f5e0;padding:18px;border-radius:12px;margin-top:14px;text-align:center}
.hl .sm{font-size:12px;color:#555}
.hl .big{font-size:30px;color:#0a7d5a;font-weight:bold;margin:6px 0}
.dec{margin-top:14px;padding:14px;background:#fff;border-radius:12px;text-align:center;border:2px solid}
.tip{font-size:11px;color:#888;margin-top:12px;line-height:1.6;background:#f8f8f8;padding:10px;border-radius:8px}
.ac-wrap{position:relative}
.ac-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:2px solid #11998e;border-top:none;border-radius:0 0 12px 12px;max-height:280px;overflow-y:auto;z-index:100;display:none;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.ac-list.show{display:block}
.ac-item{padding:12px 14px;border-bottom:1px solid #eee;cursor:pointer;font-size:14px;color:#222}
.ac-item:last-child{border-bottom:none}
.ac-item:active,.ac-item:hover{background:#e8f8f2}
.ac-item .m{font-weight:600;color:#222}
.ac-item .info{font-size:11px;color:#888;margin-top:2px}
.ac-empty{padding:12px 14px;color:#888;font-size:13px;text-align:center}
/* Section */
.section{background:#f8f9fa;padding:12px;border-radius:12px;margin-top:14px;border-left:4px solid #11998e}
.section-title{font-size:13px;font-weight:bold;color:#11998e;margin-bottom:10px}
/* Profit Hide */
.profit-hidden{background:#fff8e1;border:2px dashed #f9a825;border-radius:12px;padding:14px;margin-top:14px;text-align:center;cursor:pointer;user-select:none}
.profit-hidden .eye{font-size:24px}
.profit-hidden .txt{font-size:13px;color:#666;margin-top:4px}
.profit-shown{background:#fff8e1;border:2px solid #f9a825;border-radius:12px;padding:14px;margin-top:14px;text-align:center}
.profit-shown .lbl{font-size:12px;color:#666}
.profit-shown .amt{font-size:26px;color:#e65100;font-weight:bold;margin-top:4px}
.profit-shown .sub2{font-size:11px;color:#888;margin-top:4px}
.copy-btn{background:#f0f0f0;color:#333;border:none;padding:8px 12px;border-radius:8px;font-size:12px;margin-top:8px;font-weight:normal}
/* Summary */
.summary-bar{background:#e3f2fd;padding:10px;border-radius:10px;margin-top:12px;font-size:12px;color:#0d47a1;text-align:center}
</style>
</head>

</select>

<option value="1.00">০-৩ মাস</option>
<option value="0.97">৩-৬ মাস</option>
<option value="0.93">৬-১২ মাস</option>
<option value="0.85">১-২ বছর</option>
<option value="0.75">২-৩ বছর</option>
<option value="0.65">৩+ বছর</option>
</select>

<label>৩) Box + Charger আছে?</label>
<select id="boxCharger">
<option value="1.03">✅ হ্যাঁ, সব আছে (+3%)</option>
<option value="1.00" selected>⚠️ শুধু চার্জার আছে</option>
<option value="0.97">❌ কিছুই নেই (-3%)</option>
</select>

<label>৪) Phone খোলা হয়েছে কি?</label>
<select id="opened">
<option value="1.00" selected>❌ না, কখনো খোলা হয়নি</option>
<option value="0.92">⚠️ হ্যাঁ, একবার খোলা হয়েছে (-8%)</option>
</select>

<label>৫) Display Change হয়েছে কি?</label>
<select id="display">
<option value="1.00" selected>❌ না, original display</option>
<option value="0.75">⚠️ হ্যাঁ, change হয়েছে (-25%)</option>
</select>

<label>৬) Battery Health</label>
<select id="battery">
<option value="1.00" selected>✅ ৮৫%+ (ভালো)</option>
<option value="0.95">⚠️ ৭৫-৮৫% (-5%)</option>
<option value="0.90">❌ ৭৫% এর নিচে (-10%)</option>
</select>

<label>৭) Scratch Status</label>
<select id="scratch">
<option value="1.00" selected>✨ Fresh (একদম পরিষ্কার)</option>
<option value="0.95">Hi (সামান্য দাগ) (-5%)</option>
<option value="0.88">Medium (মোটামুটি) (-12%)</option>
<option value="0.80">Low (অনেক scratch) (-20%)</option>
</select>

<label>৮) Back Panel Condition</label>
<select id="backPanel">
<option value="1.00" selected>✨ Fresh (ভালো)</option>
<option value="0.95">⚠️ সামান্য দাগ (-5%)</option>
<option value="0.90">❌ ভাঙা/ফাটা (-10%)</option>
</select>

<label>৯) Camera Condition</label>
<select id="camera">
<option value="1.00" selected>✅ ঠিক আছে</option>
<option value="0.92">❌ সমস্যা আছে (-8%)</option>
</select>

<label>১০) Speaker / Mic</label>
<select id="speaker">
<option value="1.00" selected>✅ ঠিক আছে</option>
<option value="0.90">❌ সমস্যা আছে (-10%)</option>
</select>

<div class="summary-bar" id="summaryBar">📊 Condition Summary: 100% (সব ঠিক আছে)</div>
</div>

<button onclick="calculate()">💡 Offer Price দেখুন</button>
<div class="result" id="result"></div>
</div>

// ===== Autocomplete =====
var phoneInput=document.getElementById('phoneInput');
var acList=document.getElementById('acList');
var selectedPhone=null;

phoneInput.addEventListener('input',function(){
  var q=this.value.trim().toLowerCase();
  acList.innerHTML='';
  selectedPhone=null;
  if(q.length<1){acList.classList.remove('show');return}
  var matches=[];
  for(var i=0;i<PHONES.length;i++){
    if(PHONES[i][0].toLowerCase().indexOf(q)>-1){
      matches.push(PHONES[i]);
      if(matches.length>=20)break;
    }
  }
  if(matches.length===0){
    acList.innerHTML='<div class="ac-empty">মডেল পাওয়া যায়নি — Market Price নিজে লিখুন</div>';
    acList.classList.add('show');
    return;
  }
  for(var j=0;j<matches.length;j++){
    var p=matches[j];
    var div=document.createElement('div');
    div.className='ac-item';
    div.innerHTML='<div class="m">'+p[0]+'</div><div class="info">Market Price: ৳'+p[2].toLocaleString()+'</div>';
    div.onclick=(function(phone){
      return function(){
        phoneInput.value=phone[0];
        document.getElementById('marketPrice').value=phone[2];
        selectedPhone=phone;
        acList.classList.remove('show');
      };
    })(p);
    acList.appendChild(div);
  }
  acList.classList.add('show');
});

document.addEventListener('click',function(e){
  if(!e.target.closest('.ac-wrap'))acList.classList.remove('show');
});

// ===== Live Condition Summary =====
var condFields=['warranty','buyDate','boxCharger','opened','display','battery','scratch','backPanel','camera','speaker'];
condFields.forEach(function(id){
  document.getElementById(id).addEventListener('change',updateSummary);
});

function updateSummary(){
  var total=1;
  condFields.forEach(function(id){
    total *= parseFloat(document.getElementById(id).value);
  });
  var percent=Math.round(total*100);
  var bar=document.getElementById('summaryBar');
  var color='#0d47a1';
  if(percent>=95)color='#0a7d5a';
  else if(percent>=80)color='#e67e22';
  else color='#c0392b';
  bar.innerHTML='📊 Condition Score: <b style="color:'+color+'">'+percent+'%</b> (Market price এর তুলনায়)';
}

// ===== AUTO PROFIT =====
function getAutoProfit(price){
  if(price<5000)return 500;
  if(price<15000)return 800;
  if(price<30000)return 1200;
  if(price<60000)return 1800;
  if(price<100000)return 2800;
  return 4500;
}

function calculate(){
  var name=phoneInput.value||'Phone';
  var market=parseFloat(document.getElementById('marketPrice').value);
  if(!market){alert('Market Price দিন!');return}

  // Get all condition multipliers
  var m=1;
  var detail=[];
  condFields.forEach(function(id){
    var v=parseFloat(document.getElementById(id).value);
    m *= v;
  });

  // Final adjusted value
  var adjustedValue = Math.floor(market * m / 100) * 100;
  var conditionPercent = Math.round(m*100);

  // Auto profit
  var profit = getAutoProfit(adjustedValue);

  // Max Buy (আপনি সর্বোচ্চ এই দামে কিনবেন)
  var maxBuy = Math.floor((adjustedValue - profit)/100)*100;

  // Offer Price = adjusted value (customer কে যা বলবেন)
  var offerPrice = adjustedValue;

  // Minimum Price (দরদাম করলে)
  var minPrice = maxBuy;

  var result=document.getElementById('result');
  result.innerHTML=`
    <div class="row"><span class="label-txt">📱 Phone</span><span class="value">${name}</span></div>
    <div class="row"><span class="label-txt">📊 Market Price</span><span class="value">৳${market.toLocaleString()}</span></div>
    <div class="row"><span class="label-txt">✨ Condition Score</span><span class="value">${conditionPercent}%</span></div>
    <div class="row"><span class="label-txt">💎 Adjusted Value</span><span class="value">৳${adjustedValue.toLocaleString()}</span></div>

    <div class="hl">
      <div class="sm">💼 কাস্টমারকে এই দাম বলুন (Offer Price)</div>
      <div class="big">৳${offerPrice.toLocaleString()}</div>
      <div class="sm">Condition অনুযায়ী adjusted</div>
    </div>

    <div class="dec" style="border-color:#f9a825">
      <div style="font-size:13px;color:#666">💡 দরদাম করলে সর্বনিম্ন</div>
      <div style="font-size:20px;font-weight:bold;color:#e65100;margin-top:4px">৳${minPrice.toLocaleString()}</div>
      <div style="font-size:11px;color:#888;margin-top:4px">এর নিচে বিক্রি করলে লস</div>
    </div>

    <div id="profitArea" class="profit-hidden" onclick="toggleProfit(${profit}, ${maxBuy}, ${adjustedValue})">
      <div class="eye">👁️</div>
      <div class="txt">Profit Margin দেখতে tap করুন</div>
    </div>

    <p class="tip">💡 <b>ব্যবহার:</b> কাস্টমারকে <b>Offer Price</b> বলবেন। দরদাম করলে <b>সর্বনিম্ন দাম</b> পর্যন্ত নামতে পারবেন। Profit margin কাস্টমার দেখতে পাবে না।</p>
  `;
  result.classList.add('show');
  result.scrollIntoView({behavior:'smooth',block:'start'});
}

function toggleProfit(profit, maxBuy, adjustedValue){
  var area=document.getElementById('profitArea');
  if(area.classList.contains('profit-hidden')){
    area.className='profit-shown';
    area.innerHTML=`
      <div class="lbl">💰 আপনার Profit Margin</div>
      <div class="amt">৳${profit.toLocaleString()}</div>
      <div class="sub2">কেনার সর্বোচ্চ দাম: ৳${maxBuy.toLocaleString()}</div>
      <button class="copy-btn" onclick="event.stopPropagation();hideProfit()">🙈 আবার লুকান</button>
    `;
  }
}

function hideProfit(){
  var area=document.getElementById('profitArea');
  area.className='profit-hidden';
  area.innerHTML=`
    <div class="eye">👁️</div>
    <div class="txt">Profit Margin দেখতে tap করুন</div>
  `;
}

// Initialize summary
updateSummary();
