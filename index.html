<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>PHONE VALUE CHECK</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI','Noto Sans Bengali',sans-serif;background:linear-gradient(135deg,#f5f5f0,#e8e4d8);min-height:100vh;padding:14px;font-size:15px;color:#2a2a2a}
.box{background:#fff;max-width:520px;margin:0 auto;padding:24px 18px;border-radius:20px;border:1px solid #e0d8c0;box-shadow:0 20px 50px rgba(80,60,20,.15)}
h1{text-align:center;font-size:24px;color:#7a5c14;margin-bottom:4px;font-weight:800;letter-spacing:2px;font-family:'Playfair Display',Georgia,serif}
.sub{text-align:center;color:#999;font-size:11px;margin-bottom:22px;letter-spacing:1px;text-transform:uppercase}
label{display:block;margin-top:16px;margin-bottom:7px;font-weight:600;color:#555;font-size:12.5px}
input,select{width:100%;padding:13px 14px;border:1.5px solid #e0d8c0;border-radius:10px;font-size:15px;background:#fefcf7;color:#2a2a2a;-webkit-appearance:none;appearance:none;font-family:inherit}
input:focus,select:focus{border-color:#7a5c14;outline:none;box-shadow:0 0 0 3px rgba(122,92,20,.12);background:#fff}
select{background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237a5c14' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 12px center;background-size:18px;padding-right:42px;background-color:#fefcf7}
button{width:100%;margin-top:22px;padding:16px;background:linear-gradient(135deg,#7a5c14,#5c4410);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;letter-spacing:1px;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(122,92,20,.3)}
button:active{transform:scale(.98)}
.result{margin-top:22px;padding:18px;background:#fefcf7;border-radius:14px;border:1px solid #e0d8c0;border-left:3px solid #7a5c14;display:none}
.result.show{display:block;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0e8d0;font-size:13.5px;gap:8px;align-items:center}
.row:last-child{border:none}
.label-txt{color:#888;flex:1}
.value{font-weight:600;color:#2a2a2a;text-align:right}
.editable{background:#fff8e1;border-radius:6px;padding:4px 8px;cursor:pointer;border:1px dashed transparent;transition:.2s;min-width:60px;text-align:right;font-weight:700;color:#7a5c14}
.editable:active,.editable:hover{border-color:#7a5c14;background:#fdf2c8}
.edit-input{width:70px;padding:5px 8px;border:1.5px solid #7a5c14;border-radius:6px;font-size:14px;font-weight:700;color:#7a5c14;text-align:right;background:#fff;font-family:inherit}
.hl{background:linear-gradient(135deg,#fdf7e0,#f5ecd0);padding:22px 18px;border-radius:14px;margin-top:16px;text-align:center;border:1.5px solid #7a5c14}
.hl .sm{font-size:12px;color:#7a5c14;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;font-weight:600}
.hl .big{font-size:38px;color:#7a5c14;font-weight:800;margin:8px 0;font-family:'Playfair Display',Georgia,serif}
.ac-wrap{position:relative}
.ac-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid #7a5c14;border-top:none;border-radius:0 0 10px 10px;max-height:300px;overflow-y:auto;z-index:100;display:none;box-shadow:0 10px 30px rgba(80,60,20,.15)}
.ac-list.show{display:block}
.ac-item{padding:13px 14px;border-bottom:1px solid #f5f0e0;cursor:pointer;font-size:14px;color:#444}
.ac-item:last-child{border-bottom:none}
.ac-item:active,.ac-item:hover{background:#fdf7e0;color:#7a5c14}
.ac-empty{padding:14px;color:#999;font-size:13px;text-align:center}
.section{background:#fefcf7;padding:14px;border-radius:12px;margin-top:16px;border:1px solid #f0e8d0;border-left:3px solid #7a5c14}
.section-title{font-size:12.5px;font-weight:700;color:#7a5c14;margin-bottom:8px;letter-spacing:1px;text-transform:uppercase}
.profit-hidden{background:linear-gradient(135deg,#fdf7e0,#f5ecd0);border:1.5px dashed #7a5c14;border-radius:12px;padding:16px;margin-top:16px;text-align:center;cursor:pointer;user-select:none}
.profit-hidden .txt{font-size:13px;color:#7a5c14;font-weight:600}
.profit-panel{background:linear-gradient(135deg,#fdf7e0,#f5ecd0);border:1.5px solid #7a5c14;border-radius:12px;padding:16px;margin-top:16px;display:none}
.profit-panel.show{display:block}
.profit-panel label{color:#7a5c14;font-size:12px;margin-top:8px}
.profit-panel input{padding:11px;font-size:15px;border-color:#7a5c14;background:#fff}
.profit-result{background:#fff;border-radius:10px;padding:14px;margin-top:12px;text-align:center;border:1px solid #e0d8c0}
.profit-result .lbl{font-size:11px;color:#888;letter-spacing:1px;text-transform:uppercase}
.profit-result .amt{font-size:26px;color:#7a5c14;font-weight:800;margin-top:6px;font-family:'Playfair Display',Georgia,serif}
.profit-result .per{font-size:11px;color:#888;margin-top:4px}
.calc-btn2{background:linear-gradient(135deg,#555,#333);color:#fff;padding:10px;margin-top:12px;font-size:13px;border-radius:8px;border:none;box-shadow:none}
.action-btns{display:flex;gap:10px;margin-top:16px}
.action-btns button{margin-top:0;padding:13px;font-size:13.5px}
.btn-print{background:linear-gradient(135deg,#7a5c14,#5c4410);color:#fff}
.btn-reset{background:linear-gradient(135deg,#f0e8d0,#e0d8c0);color:#555;box-shadow:none}
.tip{font-size:11px;color:#999;margin-top:12px;text-align:center;line-height:1.5}
.print-detail{display:none}
/* ===== PRINT STYLES ===== */
@media print{
  body{background:#fff;padding:0;color:#000;font-size:12px;font-family:'Noto Sans Bengali',sans-serif}
  .box{box-shadow:none;padding:0;max-width:100%;background:#fff;border:none;border-radius:0}
  h1{display:none}
  .sub{display:none}
  label,select,input,.section,.action-btns,.profit-panel,.profit-hidden,.ac-wrap,.calc-btn,.ac-list,button,.tip{display:none !important}
  .result{display:block !important;background:#fff;border:none;padding:0;margin:0;border-radius:0}
  .result > .row{display:none !important}
  .result > .hl{display:none !important}
  .result > #profitTrigger,.result > #profitPanel,.result > .action-btns{display:none !important}
  .print-detail{display:block !important;color:#000}
  .print-detail .row{display:flex !important;justify-content:space-between;padding:6px 0;border-bottom:1px dotted #999;font-size:12px;align-items:center}
  .print-detail .row:last-child{border:none}
  .print-detail .label-txt{color:#000 !important;flex:1}
  .print-detail .value{color:#000 !important;font-weight:700;text-align:right}
  .print-detail .head-title{text-align:center;font-size:22px;font-weight:800;letter-spacing:3px;border-bottom:3px double #000;padding-bottom:10px;margin-bottom:14px;font-family:'Playfair Display',Georgia,serif}
  .print-detail .section-head{font-weight:700;font-size:13px;margin:14px 0 6px;border-bottom:1px solid #000;padding-bottom:4px;text-transform:uppercase;letter-spacing:1px}
  .print-detail .final-box{border:3px double #000;margin-top:16px;padding:14px;text-align:center;background:#f5f0e0}
  .print-detail .final-box .lbl{font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:6px}
  .print-detail .final-box .amt{font-size:22px;font-weight:800;font-family:'Playfair Display',Georgia,serif}
  .sign-area{display:flex !important;justify-content:space-between;margin-top:60px;padding-top:20px;border-top:1px dashed #000;gap:30px}
  .sign-area > div{flex:1;font-size:12px}
  .sign-area .sign-label{font-weight:700;margin-bottom:30px}
}
.sign-area{display:none}
</style>
</head>
<body>
<div class="box">
<h1>PHONE VALUE CHECK</h1>
<p class="sub">2nd Hand Phone Dealer Tool</p>

<label>ফোনের নাম / মডেল</label>
<div class="ac-wrap">
  <input type="text" id="phoneInput" placeholder="" autocomplete="off">
  <div class="ac-list" id="acList"></div>
</div>

<label>RAM / Storage (Android: 8/128, iPhone: 128)</label>
<input type="text" id="ramRom" placeholder="8/128 বা 128" autocomplete="off">

<label>ক্রয় মূল্য (৳)</label>
<input type="number" id="buyPrice" placeholder="" inputmode="numeric">

<div class="section">
<div class="section-title">ফোনের কন্ডিশন</div>

<label>১) ক্রয়ের তারিখ</label>
<input type="date" id="buyDate">

<label>২) ফোনের ধরন</label>
<select id="officialType" onchange="toggleWarranty()">
<option value="unofficial" selected>✘ Unofficial / Warranty নেই</option>
<option value="official">✔ Official / Warranty আছে</option>
</select>

<div id="warrantySection" style="display:none">
  <label>২ক) Warranty কত মাস বাকি? (১-১২)</label>
  <input type="number" id="warrantyMonths" inputmode="numeric" min="1" max="12">
</div>

<label>৩) ফোন খোলা হয়েছে?</label>
<select id="opened">
<option value="0" selected>✘ না, কখনো খোলা হয়নি</option>
<option value="1">✔ হ্যাঁ, ১ বার</option>
<option value="2">✔ হ্যাঁ, ২ বার</option>
<option value="3">✔ হ্যাঁ, ৩+ বার</option>
</select>

<label>৪) ব্যাটারি হেলথ</label>
<select id="battery">
<option value="0" selected>✔ Excellent (৯৫%+)</option>
<option value="1">✔ Very Good (৯০-৯৫%)</option>
<option value="2">✔ Good (৮৫-৯০%)</option>
<option value="3">✔ Fair (৮০-৮৫%)</option>
<option value="4">✔ Medium (৭৫-৮০%)</option>
<option value="5">✔ Poor (৭০-৭৫%)</option>
<option value="6">✘ Bad (৭০% এর নিচে)</option>
</select>

<label>৫) স্ক্র্যাচ স্ট্যাটাস</label>
<select id="scratch">
<option value="0" selected>✔ Fresh (একদম পরিষ্কার)</option>
<option value="1">✔ Low (সামান্য দাগ)</option>
<option value="2">✔ Medium (মোটামুটি)</option>
<option value="3">✘ High (অনেক দাগ)</option>
</select>

<label>৬) ক্যামেরা কন্ডিশন</label>
<select id="camera">
<option value="0" selected>✔ Good (ঠিক আছে)</option>
<option value="1">✔ Medium (সামান্য সমস্যা)</option>
<option value="2">✘ Bad (সমস্যা আছে)</option>
</select>

<label>৭) ডিসপ্লে কন্ডিশন</label>
<select id="display">
<option value="0" selected>✔ Original, ঠিক আছে</option>
<option value="1">✔ Original, কিন্তু সমস্যা</option>
<option value="2">✘ Change করা হয়েছে</option>
</select>

<label>৮) সামগ্রিক অবস্থা</label>
<select id="overall">
<option value="0">✔ OK</option>
<option value="1" selected>✔ Good</option>
<option value="2">✔ Medium</option>
<option value="3">✘ Poor</option>
</select>

<label>৯) বক্স আছে?</label>
<select id="boxItem">
<option value="0" selected>✔ হ্যাঁ, Original Box আছে</option>
<option value="1">✔ Box আছে কিন্তু original না</option>
<option value="2">✘ না, Box নেই</option>
</select>

<label>১০) চার্জার আছে?</label>
<select id="chargerItem">
<option value="0" selected>✔ হ্যাঁ, Original Charger আছে</option>
<option value="1">✔ Charger আছে কিন্তু original না</option>
<option value="2">✔ না, Charger নেই (Company দেয়নি)</option>
<option value="3">✘ না, হারিয়ে ফেলেছি</option>
</select>

</div>

<button class="calc-btn" onclick="calculate()">মূল্য দেখুন</button>
<div class="result" id="result"></div>
</div>

function getCategory(){
  var name = phoneInput.value.toLowerCase();
  if(/iphone|galaxy s|galaxy z|galaxy note|nothing|pixel|oneplus [0-9]|xperia|rog phone|xiaomi 1|find x|realme gt|vivo x|edge [0-9]/.test(name)) return 'A';
  if(/tecno|infinix/.test(name)) return 'C';
  if(/itel|lava|symphony|walton/.test(name)) return 'D';
  return 'B';
}

function getDepDrop(days, cat){
  var table = depTable[cat] || depTable.B;
  for(var i=0;i<table.length;i++){
    if(days <= table[i].days) return table[i].drop;
  }
  return table[table.length-1].drop;
}

function formatRamRom(input){
  if(!input) return '';
  input = input.trim();
  if(input.indexOf('/') > -1){
    var parts = input.split('/');
    return {label:'RAM/Storage', value: parts[0].trim()+'GB/'+parts[1].trim()+'GB'};
  } else {
    return {label:'Storage', value: input+'GB'};
  }
}

function calcCurrentPrice(){
  var dep = (lastCalc.customDep !== null) ? lastCalc.customDep : lastCalc.depDrop;
  var cond = (lastCalc.customCond !== null) ? lastCalc.customCond : lastCalc.condDrop;
  var totalDrop = dep + cond;
  var price = Math.floor(lastCalc.buy * (100 - totalDrop) / 100 / 100) * 100;
  var minPrice = Math.floor(lastCalc.buy * 0.25 / 100) * 100;
  if(price < minPrice) price = minPrice;
  if(price > lastCalc.buy) price = lastCalc.buy;
  return {totalDrop:totalDrop, dep:dep, cond:cond, price:price};
}

function calculate(){
  var name = phoneInput.value || 'Phone';
  var cat = getCategory();
  var buy = parseFloat(document.getElementById('buyPrice').value);
  var ramRomRaw = document.getElementById('ramRom').value;
  if(!buy){alert('ক্রয় মূল্য দিন!');return}
  if(!phoneInput.value){alert('ফোনের মডেল লিখুন!');return}

  var buyDateStr = document.getElementById('buyDate').value;
  var buyDate = buyDateStr ? new Date(buyDateStr) : new Date();
  var now = new Date();
  var days = Math.floor((now - buyDate)/(1000*60*60*24));
  if(days < 1) days = 1;

  var usedText = '';
  if(days < 7) usedText = days+' দিন';
  else if(days < 30) usedText = Math.floor(days/7)+' সপ্তাহ';
  else if(days < 365) usedText = Math.floor(days/30)+' মাস';
  else {
    var y = Math.floor(days/365);
    var m = Math.floor((days%365)/30);
    usedText = y+' বছর';
    if(m>0) usedText += ' '+m+' মাস';
  }

  var depDrop = getDepDrop(days, cat);

  var warrantyDrop = 0;
  var warrantyText = 'N/A (Unofficial)';
  if(document.getElementById('officialType').value === 'official'){
    var wm = parseInt(document.getElementById('warrantyMonths').value) || 0;
    if(wm >= 6){ warrantyDrop = 0; warrantyText = wm+' মাস বাকি'; }
    else if(wm >= 3){ warrantyDrop = 0; warrantyText = wm+' মাস বাকি'; }
    else if(wm >= 1){ warrantyDrop = warrantyDropArr[cat][2]; warrantyText = wm+' মাস বাকি'; }
    else { warrantyDrop = warrantyDropArr[cat][3]; warrantyText = 'N/A'; }
  } else {
    warrantyDrop = warrantyDropArr[cat][3];
    warrantyText = 'N/A';
  }

  var dIdx = document.getElementById('display').selectedIndex;
  var bIdx = parseInt(document.getElementById('battery').value);
  var sIdx = parseInt(document.getElementById('scratch').value);
  var cIdx = parseInt(document.getElementById('camera').value);
  var oIdx = parseInt(document.getElementById('opened').value);
  var ovIdx = parseInt(document.getElementById('overall').value);
  var bxIdx = parseInt(document.getElementById('boxItem').value);
  var chIdx = parseInt(document.getElementById('chargerItem').value);

  var displayDrop = displayDrops[cat][dIdx];
  var batteryDrop = batteryDrops[cat][bIdx];
  var scratchDrop = scratchDrops[cat][sIdx];
  var cameraDrop = cameraDrops[cat][cIdx];
  var openedDrop = openedDrops[cat][oIdx];
  var overallBonus = overallAdj[cat][ovIdx];
  var boxDrop = boxDrops[cat][bxIdx];
  var chargerDrop = chargerDrops[cat][chIdx];

  var displayText = ['Original','Original (সমস্যা)','Change হয়েছে'][dIdx];
  var batteryText = document.getElementById('battery').selectedOptions[0].text.replace(/^[✔✘]\s*/,'');
  var scratchText = document.getElementById('scratch').selectedOptions[0].text.replace(/^[✔✘]\s*/,'');
  var cameraText = document.getElementById('camera').selectedOptions[0].text.replace(/^[✔✘]\s*/,'');
  var openedText = document.getElementById('opened').selectedOptions[0].text.replace(/^[✔✘]\s*/,'');
  var overallText = document.getElementById('overall').selectedOptions[0].text.replace(/^[✔✘]\s*/,'');
  var boxText = document.getElementById('boxItem').selectedOptions[0].text.replace(/^[✔✘]\s*/,'');
  var chargerText = document.getElementById('chargerItem').selectedOptions[0].text.replace(/^[✔✘]\s*/,'');

  var phoneType = document.getElementById('officialType').value === 'official' ? 'Official' : 'Unofficial';
  var ramRom = formatRamRom(ramRomRaw);

  // Condition drop (সব condition এর যোগফল)
  var condDrop = displayDrop + batteryDrop + scratchDrop + cameraDrop + openedDrop + boxDrop + chargerDrop + warrantyDrop + Math.abs(overallBonus);
  if(overallBonus > 0) condDrop -= overallBonus;
  if(condDrop < 0) condDrop = 0;

  // Save state
  lastCalc.buy = buy;
  lastCalc.depDrop = depDrop;
  lastCalc.condDrop = condDrop;
  lastCalc.customDep = null;
  lastCalc.customCond = null;

  lastCalc.base = priceData.price;

    <div class="row"><span class="label-txt">কন্ডিশন ছাড়</span><span class="value editable" id="condEdit" data-val="${condDrop}" data-field="cond">-${condDrop}%</span></div>

    <div class="hl">
      <div class="sm">বর্তমান বাজার মূল্য</div>

    <div id="profitTrigger" class="profit-hidden" onclick="showProfitPanel()">

        <div class="lbl">বর্তমান মূল্য</div>

      </div>

      <div class="sign-area">
        <div>
          <div class="sign-label">বিক্রেতা</div>
          <div>নাম: ____________________</div>
          <div style="margin-top:6px;">ফোন: ____________________</div>
        </div>
        <div style="text-align:right;">
          <div class="sign-label">ক্রেতা</div>
          <div>নাম: ____________________</div>

    </div>
  `;
  result.classList.add('show');

  // Attach double-tap listeners
  attachEditListeners();

  result.scrollIntoView({behavior:'smooth',block:'start'});
}

// ===== DOUBLE TAP EDIT =====
function attachEditListeners(){
  ['depEdit','condEdit'].forEach(function(id){
    var el = document.getElementById(id);
    if(!el) return;
    var lastTap = 0;
    el.addEventListener('click', function(e){
      var now = Date.now();
      if(now - lastTap < 400){
        // Double tap
        e.preventDefault();
        makeEditable(el);
      }
      lastTap = now;
    });
  });
}

function makeEditable(el){
  if(el.querySelector('input')) return;
  var field = el.getAttribute('data-field');
  var val = el.getAttribute('data-val');
  var originalHTML = el.innerHTML;
  el.innerHTML = '<input type="number" class="edit-input" value="'+val+'" min="0" max="100">';
  var inp = el.querySelector('input');
  inp.focus();
  inp.select();

  function commit(){
    var newVal = parseFloat(inp.value);
    if(isNaN(newVal) || newVal < 0) newVal = 0;
    if(newVal > 100) newVal = 100;
    el.setAttribute('data-val', newVal);
    el.innerHTML = '-'+newVal+'%';

    if(field === 'dep') lastCalc.customDep = newVal;
    if(field === 'cond') lastCalc.customCond = newVal;

    // Update price
    var pd = calcCurrentPrice();
    lastCalc.base = pd.price;

    document.getElementById('currentPrice').textContent = '৳'+pd.price.toLocaleString('bn-BD');
    document.getElementById('printPrice').textContent = '৳'+pd.price.toLocaleString('bn-BD');
    document.getElementById('printDep').textContent = '-'+pd.dep+'%';
    document.getElementById('printCond').textContent = '-'+pd.cond+'%';

    // Update profit if open
    if(document.getElementById('profitPanel').classList.contains('show')){
      calcProfit();
    }
  }

  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ inp.blur(); }
  });
}

// ===== PRINT =====
function doPrint(){
  window.print();
}

// ===== PROFIT =====
function showProfitPanel(){
  document.getElementById('profitTrigger').style.display='none';
  document.getElementById('profitPanel').classList.add('show');
  document.getElementById('profitAmount').focus();
}

function hideProfitPanel(){
  document.getElementById('profitPanel').classList.remove('show');
  document.getElementById('profitTrigger').style.display='block';
}

function calcProfit(){
  var profit=parseFloat(document.getElementById('profitAmount').value)||0;
  var base=lastCalc.base;
  if(profit<=0 || base<=0){
    document.getElementById('finalAmount').textContent='৳০';
    document.getElementById('profitDetail').textContent='';
    return;
  }
  var finalPrice=base + profit;
  var pct=((profit/base)*100).toFixed(1);
  document.getElementById('finalAmount').textContent='৳'+finalPrice.toLocaleString('bn-BD');
  document.getElementById('profitDetail').textContent='লাভ: ৳'+profit.toLocaleString('bn-BD')+' ('+pct+'%)';
}

function resetForm(){
  document.getElementById('phoneInput').value='';
  document.getElementById('ramRom').value='';
  document.getElementById('buyPrice').value='';
  document.getElementById('buyDate').valueAsDate = new Date();
  document.getElementById('officialType').value='unofficial';
  document.getElementById('warrantySection').style.display='none';
  document.getElementById('warrantyMonths').value='';
  document.getElementById('opened').value='0';
  document.getElementById('battery').value='0';
  document.getElementById('scratch').value='0';
  document.getElementById('camera').value='0';
  document.getElementById('display').value='0';
  document.getElementById('overall').value='1';
  document.getElementById('boxItem').value='0';
  document.getElementById('chargerItem').value='0';
  document.getElementById('result').classList.remove('show');
  lastCalc = { buy:0, depDrop:0, condDrop:0, base:0, customDep:null, customCond:null };
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
