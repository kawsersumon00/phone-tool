<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11998e">
<title>PHONE VALUE CHECK</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:linear-gradient(135deg,#11998e,#38ef7d);min-height:100vh;padding:12px;font-size:15px}
.box{background:#fff;max-width:520px;margin:0 auto;padding:20px 16px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
h1{text-align:center;font-size:20px;color:#11998e;margin-bottom:3px;font-weight:bold;letter-spacing:1px}
.sub{text-align:center;color:#888;font-size:12px;margin-bottom:18px}
label{display:block;margin-top:14px;margin-bottom:6px;font-weight:600;color:#333;font-size:13px}
input,select{width:100%;padding:13px 12px;border:2px solid #ddd;border-radius:12px;font-size:15px;background:#fff;-webkit-appearance:none;appearance:none}
input:focus,select:focus{border-color:#11998e;outline:none}
button{width:100%;margin-top:20px;padding:16px;background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:bold;-webkit-appearance:none}
button:active{transform:scale(.98)}
.result{margin-top:20px;padding:16px;background:#f0fff4;border-radius:14px;border-left:5px solid #11998e;display:none}
.result.show{display:block}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #ddd;font-size:13px;gap:8px}
.label-txt{color:#666;flex:1}
.value{font-weight:bold;color:#222;text-align:right}
.hl{background:#d4f5e0;padding:18px;border-radius:12px;margin-top:14px;text-align:center}
.hl .sm{font-size:12px;color:#555}
.hl .big{font-size:32px;color:#0a7d5a;font-weight:bold;margin:6px 0}
.tip{font-size:11px;color:#888;margin-top:12px;line-height:1.6;background:#f8f8f8;padding:10px;border-radius:8px}
.ac-wrap{position:relative}
.ac-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:2px solid #11998e;border-top:none;border-radius:0 0 12px 12px;max-height:280px;overflow-y:auto;z-index:100;display:none;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.ac-list.show{display:block}
.ac-item{padding:12px 14px;border-bottom:1px solid #eee;cursor:pointer;font-size:14px;color:#222}
.ac-item:last-child{border-bottom:none}
.ac-item:active,.ac-item:hover{background:#e8f8f2}
.ac-item .m{font-weight:600;color:#222}
.ac-empty{padding:12px 14px;color:#888;font-size:13px;text-align:center}
.section{background:#f8f9fa;padding:12px;border-radius:12px;margin-top:14px;border-left:4px solid #11998e}
.section-title{font-size:13px;font-weight:bold;color:#11998e;margin-bottom:6px}
.profit-hidden{background:#fff8e1;border:2px dashed #f9a825;border-radius:12px;padding:14px;margin-top:14px;text-align:center;cursor:pointer;user-select:none}
.profit-hidden .eye{font-size:24px}
.profit-hidden .txt{font-size:13px;color:#666;margin-top:4px}
.profit-panel{background:#fff8e1;border:2px solid #f9a825;border-radius:12px;padding:14px;margin-top:14px;display:none}
.profit-panel.show{display:block}
.profit-panel label{color:#e65100;font-size:12px;margin-top:8px}
.profit-panel input{padding:10px;font-size:15px;border-color:#f9a825}
.profit-result{background:#fff;border-radius:8px;padding:12px;margin-top:10px;text-align:center}
.profit-result .lbl{font-size:12px;color:#666}
.profit-result .amt{font-size:24px;color:#0a7d5a;font-weight:bold;margin-top:4px}
.profit-result .per{font-size:11px;color:#888;margin-top:3px}
.calc-btn{background:#f9a825;color:#fff;padding:10px;margin-top:10px;font-size:14px;border-radius:8px}
.action-btns{display:flex;gap:8px;margin-top:14px}
.action-btns button{margin-top:0;padding:12px;font-size:14px}
.btn-print{background:linear-gradient(135deg,#3498db,#2980b9)}
@media print{
  body{background:#fff;padding:0}
  .box{box-shadow:none;padding:15px;max-width:100%}
  h1{color:#000}
  .sub{display:none}
  label,select,input,.section,.action-btns,.tip,.profit-panel,.profit-hidden,.ac-wrap{display:none !important}
  .result{display:block !important;background:#fff;border:2px solid #11998e;padding:20px}
  .hl{background:#f0fff4;border:2px solid #11998e}
  .hl .big{color:#000}
  .print-detail{display:block !important}
}
.print-detail{display:none}
</style>
</head>
<body>
<div class="box">
<h1>PHONE VALUE CHECK</h1>
<p class="sub">2nd Hand Phone Dealer Tool</p>

<label>📱 ফোনের নাম / মডেল</label>
<div class="ac-wrap">
  <input type="text" id="phoneInput" placeholder="যেমন: Redmi Note 15 / iPhone 13 / Nothing Phone 2" autocomplete="off">
  <div class="ac-list" id="acList"></div>
</div>

<label>💵 Buy Price (নতুন অবস্থায় যত টাকা)</label>
<input type="number" id="buyPrice" placeholder="যেমন: 28000" inputmode="numeric">

<div class="section">
<div class="section-title">📋 ফোনের Condition</div>

<label>১) Buy Date (কত তারিখে কিনেছে)</label>
<input type="date" id="buyDate">

<label>২) Official / Unofficial</label>
<select id="officialType" onchange="toggleWarrantySection()">
<option value="unofficial" selected>❌ Unofficial (Warranty নেই)</option>
<option value="official">✅ Official (Warranty আছে)</option>
</select>

<div id="warrantySection" style="display:none">
  <label>২ক) Warranty কত মাস বাকি?</label>
  <select id="warrantyMonths">
    <option value="6">৬+ মাস বাকি</option>
    <option value="4">৩-৬ মাস বাকি</option>
    <option value="2">১-৩ মাস বাকি</option>
  </select>
</div>

<label>৩) Phone খোলা হয়েছে কি?</label>
<select id="opened">
<option value="0" selected>❌ না, কখনো খোলা হয়নি</option>
<option value="1">⚠️ হ্যাঁ, ১ বার</option>
<option value="2">⚠️ হ্যাঁ, ২ বার</option>
<option value="3">❌ হ্যাঁ, ৩+ বার</option>
</select>

<label>৪) Battery Health</label>
<select id="battery">
<option value="0" selected>✅ Excellent (৯৫%+)</option>
<option value="1">👍 Very Good (৯০-৯৫%)</option>
<option value="2">Good (৮৫-৯০%)</option>
<option value="3">Fair (৮০-৮৫%)</option>
<option value="4">Medium (৭৫-৮০%)</option>
<option value="5">Poor (৭০-৭৫%)</option>
<option value="6">❌ Bad (৭০% এর নিচে)</option>
</select>

<label>৫) Scratch Status</label>
<select id="scratch">
<option value="0" selected>✨ Fresh (একদম পরিষ্কার)</option>
<option value="1">Low (সামান্য দাগ)</option>
<option value="2">Medium (মোটামুটি)</option>
<option value="3">High (অনেক দাগ)</option>
</select>

<label>৬) Camera Condition</label>
<select id="camera">
<option value="0" selected>✅ Good (ঠিক আছে)</option>
<option value="1">⚠️ Medium (সামান্য সমস্যা)</option>
<option value="2">❌ Bad (সমস্যা আছে)</option>
</select>

<label>৭) Display Condition</label>
<select id="display">
<option value="0" selected>✅ Original, ঠিক আছে</option>
<option value="1">⚠️ Original, কিন্তু সমস্যা</option>
<option value="2">❌ Change করা হয়েছে</option>
</select>

<label>৮) Overall Check</label>
<select id="overall">
<option value="0">✅ OK</option>
<option value="1" selected>👍 Good</option>
<option value="2">⚠️ Medium</option>
<option value="3">❌ Poor</option>
</select>

<label>৯) Box আছে কি?</label>
<select id="boxItem">
<option value="0" selected>✅ হ্যাঁ, Original Box আছে</option>
<option value="1">⚠️ Box আছে কিন্তু original না</option>
<option value="2">❌ না, Box নেই</option>
</select>

<label>১০) Charger আছে কি?</label>
<select id="chargerItem">
<option value="0" selected>✅ হ্যাঁ, Original Charger আছে</option>
<option value="1">⚠️ Charger আছে কিন্তু original না</option>
<option value="2">❌ না, Charger নেই</option>
</select>

</div>

<button onclick="calculate()">💡 Expected Price দেখুন</button>
<div class="result" id="result"></div>
</div>

var phoneInput=document.getElementById('phoneInput');
var acList=document.getElementById('acList');

phoneInput.addEventListener('input',function(){
  var q=this.value.trim().toLowerCase();
  acList.innerHTML='';
  if(q.length<1){acList.classList.remove('show');return}
  var matches=[];
  for(var i=0;i<PHONES.length;i++){
    if(PHONES[i][0].toLowerCase().indexOf(q)>-1){
      matches.push(PHONES[i]);
      if(matches.length>=25)break;
    }
  }
  if(matches.length===0){
    acList.innerHTML='<div class="ac-empty">মডেল পাওয়া যায়নি — নাম লিখে রাখুন</div>';
    acList.classList.add('show');
    return;
  }
  for(var j=0;j<matches.length;j++){
    var p=matches[j];
    var div=document.createElement('div');
    div.className='ac-item';
    div.innerHTML='<div class="m">'+p[0]+'</div>';
    div.onclick=(function(name){
      return function(){
        phoneInput.value=name;
        acList.classList.remove('show');
      };
    })(p[0]);
    acList.appendChild(div);
  }
  acList.classList.add('show');
});

document.addEventListener('click',function(e){
  if(!e.target.closest('.ac-wrap'))acList.classList.remove('show');
});

document.getElementById('buyDate').valueAsDate = new Date();

function toggleWarrantySection(){
  var v=document.getElementById('officialType').value;
  document.getElementById('warrantySection').style.display = (v==='official')?'block':'none';

// ===== CONDITION DROP TABLES =====
var displayDrops = { A: [0,15,30], B: [0,14,28], C: [0,13,26], D: [0,12,25] };
var batteryDrops = { A: [0,2,5,10,15,22,30], B: [0,2,6,11,16,24,32], C: [0,3,7,12,18,26,34], D: [0,3,8,13,20,28,36] };
var scratchDrops = { A: [0,5,12,25], B: [0,6,13,27], C: [0,7,15,28], D: [0,8,17,30] };
var cameraDrops = { A: [0,10,22], B: [0,11,24], C: [0,13,26], D: [0,15,28] };
var openedDrops = { A: [0,8,15,25], B: [0,9,16,27], C: [0,10,18,28], D: [0,12,20,30] };
var overallAdj = { A: [3,0,-10,-25], B: [3,0,-12,-27], C: [3,0,-13,-30], D: [3,0,-15,-32] };
var boxDrops = { A: [0,5,10], B: [0,5,10], C: [0,5,10], D: [0,5,10] };
var chargerDrops = { A: [0,4,8], B: [0,4,8], C: [0,4,8], D: [0,4,8] };
var warrantyDropTable = { A: [0,0,2,12], B: [0,0,2,12], C: [0,0,3,14], D: [0,0,3,16] };

function getCategory(){
  var v = phoneInput.value;
  var name = v.toLowerCase();
  if(/iphone|galaxy s|galaxy z|nothing|pixel|oneplus [0-9]|xperia|rog phone|xiaomi 1|find x|realme gt|vivo x|edge [0-9]/.test(name)) return 'A';
  if(/tecno|infinix/.test(name)) return 'C';
  if(/itel|lava|symphony|walton/.test(name)) return 'D';
  return 'B';
}

function getDepDrop(days, cat){
  var table = depTable[cat] || depTable.B;
  for(var i=0;i<table.length;i++){
    if(days <= table[i].days) return table[i].drop;
  }
  return table[table.length-1].drop;
}

var lastCalc={base:0, buy:0};

function calculate(){
  var name = phoneInput.value || 'Phone';
  var cat = getCategory();
  var buy = parseFloat(document.getElementById('buyPrice').value);
  if(!buy){alert('Buy Price দিন!');return}
  if(!phoneInput.value){alert('ফোনের মডেল লিখুন!');return}

  var buyDateStr = document.getElementById('buyDate').value;
  var buyDate = buyDateStr ? new Date(buyDateStr) : new Date();
  var now = new Date();
  var days = Math.floor((now - buyDate)/(1000*60*60*24));
  if(days < 1) days = 1;

  var usedText = '';
  if(days < 7) usedText = days+' দিন';
  else if(days < 30) usedText = Math.floor(days/7)+' সপ্তাহ';
  else if(days < 365) usedText = Math.floor(days/30)+' মাস';
  else usedText = (days/365).toFixed(1)+' বছর';

  var depDrop = getDepDrop(days, cat);

  // Warranty Logic
  var warrantyDrop = 0;
  var warrantyText = 'Unofficial';
  if(document.getElementById('officialType').value === 'official'){
    var wm = parseInt(document.getElementById('warrantyMonths').value);
    if(wm >= 6){ warrantyDrop = 0; warrantyText = 'Official (৬+ মাস বাকি)'; }
    else if(wm >= 4){ warrantyDrop = 0; warrantyText = 'Official (৩-৬ মাস বাকি)'; }
    else if(wm >= 2){ warrantyDrop = warrantyDropTable[cat][2]; warrantyText = 'Official (১-৩ মাস বাকি)'; }
  } else {
    warrantyDrop = warrantyDropTable[cat][3];
    warrantyText = 'Unofficial (Warranty নেই)';
  }

  var dIdx = document.getElementById('display').selectedIndex;
  var bIdx = parseInt(document.getElementById('battery').value);
  var sIdx = parseInt(document.getElementById('scratch').value);
  var cIdx = parseInt(document.getElementById('camera').value);
  var oIdx = parseInt(document.getElementById('opened').value);
  var ovIdx = parseInt(document.getElementById('overall').value);
  var bxIdx = parseInt(document.getElementById('boxItem').value);
  var chIdx = parseInt(document.getElementById('chargerItem').value);

  var displayDrop = displayDrops[cat][dIdx];
  var batteryDrop = batteryDrops[cat][bIdx];
  var scratchDrop = scratchDrops[cat][sIdx];
  var cameraDrop = cameraDrops[cat][cIdx];
  var openedDrop = openedDrops[cat][oIdx];
  var overallBonus = overallAdj[cat][ovIdx];
  var boxDrop = boxDrops[cat][bxIdx];
  var chargerDrop = chargerDrops[cat][chIdx];

  var displayText = ['Original, ঠিক আছে','Original, কিন্তু সমস্যা','Change করা হয়েছে'][dIdx];
  var batteryText = document.getElementById('battery').selectedOptions[0].text;
  var scratchText = document.getElementById('scratch').selectedOptions[0].text;
  var cameraText = document.getElementById('camera').selectedOptions[0].text;
  var openedText = document.getElementById('opened').selectedOptions[0].text;
  var overallText = document.getElementById('overall').selectedOptions[0].text;
  var boxText = document.getElementById('boxItem').selectedOptions[0].text;
  var chargerText = document.getElementById('chargerItem').selectedOptions[0].text;

  var totalDrop = depDrop + displayDrop + batteryDrop + scratchDrop + cameraDrop + openedDrop + boxDrop + chargerDrop + warrantyDrop + Math.abs(overallBonus);
  if(overallBonus > 0) totalDrop -= overallBonus;
  if(totalDrop < 0) totalDrop = 0;

  var currentPrice = Math.floor(buy * (100 - totalDrop) / 100 / 100) * 100;
  var minPrice = Math.floor(buy * 0.25 / 100) * 100;
  if(currentPrice < minPrice) currentPrice = minPrice;
  if(currentPrice > buy) currentPrice = buy;

  lastCalc.base = currentPrice;
  lastCalc.buy = buy;

  var result=document.getElementById('result');
  result.innerHTML=`
    <div class="row"><span class="label-txt">📱 Phone</span><span class="value">${name}</span></div>
    <div class="row"><span class="label-txt">📅 Used</span><span class="value">${usedText}</span></div>
    <div class="row"><span class="label-txt">💵 Original Price</span><span class="value">৳${buy.toLocaleString()}</span></div>
    <div class="row"><span class="label-txt">📉 Total Drop</span><span class="value">-${totalDrop}%</span></div>

    <div class="hl">
      <div class="sm">ফোনের বর্তমান বাজার মূল্য</div>
      <div class="big">৳${currentPrice.toLocaleString()}</div>
    </div>

    <div id="profitTrigger" class="profit-hidden" onclick="showProfitPanel()">
      <div class="eye">👁️</div>
      <div class="txt">Profitable Selling Price দেখতে tap করুন</div>
    </div>

    <div id="profitPanel" class="profit-panel">
      <label>💰 আপনার Profit (টাকায় লিখুন)</label>
      <input type="number" id="profitAmount" placeholder="যেমন: 500 / 700 / 1000" inputmode="numeric" oninput="calcProfit()">
      <div class="profit-result" id="profitResult">
        <div class="lbl">Expected Selling Price</div>
        <div class="amt" id="finalAmount">৳0</div>
        <div class="per" id="profitDetail"></div>
      </div>
      <button class="calc-btn" onclick="hideProfitPanel()">🙈 আবার লুকান</button>
    </div>

    <div class="action-btns">
      <button class="btn-print" onclick="window.print()">🖨️ Print</button>
      <button style="background:linear-gradient(135deg,#95a5a6,#7f8c8d)" onclick="resetForm()">🔄 Reset</button>
    </div>

    <div class="print-detail">
      <div style="margin-top:14px;padding:12px;background:#f8f9fa;border-radius:8px;">
        <div style="font-weight:bold;color:#11998e;margin-bottom:8px;">📋 Condition Report</div>
        <div class="row"><span class="label-txt">Warranty</span><span class="value">${warrantyText}</span></div>
        <div class="row"><span class="label-txt">Display</span><span class="value">${displayText}</span></div>
        <div class="row"><span class="label-txt">Battery</span><span class="value">${batteryText}</span></div>
        <div class="row"><span class="label-txt">Scratch</span><span class="value">${scratchText}</span></div>
        <div class="row"><span class="label-txt">Camera</span><span class="value">${cameraText}</span></div>
        <div class="row"><span class="label-txt">Opened</span><span class="value">${openedText}</span></div>
        <div class="row"><span class="label-txt">Overall</span><span class="value">${overallText}</span></div>
        <div class="row"><span class="label-txt">Box</span><span class="value">${boxText}</span></div>
        <div class="row"><span class="label-txt">Charger</span><span class="value">${chargerText}</span></div>
      </div>
      <div style="margin-top:10px;padding:12px;background:#fff8e1;border-radius:8px;font-size:12px;color:#555;">
        <b>কেন দাম কমল:</b><br>
        Used Time (${usedText}): -${depDrop}%
        ${displayDrop>0?'<br>Display: -'+displayDrop+'%':''}
        ${batteryDrop>0?'<br>Battery: -'+batteryDrop+'%':''}
        ${scratchDrop>0?'<br>Scratch: -'+scratchDrop+'%':''}
        ${cameraDrop>0?'<br>Camera: -'+cameraDrop+'%':''}
        ${openedDrop>0?'<br>Opened: -'+openedDrop+'%':''}
        ${boxDrop>0?'<br>Box নেই: -'+boxDrop+'%':''}
        ${chargerDrop>0?'<br>Charger নেই: -'+chargerDrop+'%':''}
        ${warrantyDrop>0?'<br>Warranty নেই: -'+warrantyDrop+'%':''}
        ${Math.abs(overallBonus)>0 && overallBonus<0 ?'<br>Overall: -'+Math.abs(overallBonus)+'%':''}
      </div>
    </div>
  `;
  result.classList.add('show');
  result.scrollIntoView({behavior:'smooth',block:'start'});
}

function showProfitPanel(){
  document.getElementById('profitTrigger').style.display='none';
  document.getElementById('profitPanel').classList.add('show');
  document.getElementById('profitAmount').focus();
}

function hideProfitPanel(){
  document.getElementById('profitPanel').classList.remove('show');
  document.getElementById('profitTrigger').style.display='block';
}

function calcProfit(){
  var profit=parseFloat(document.getElementById('profitAmount').value)||0;
  var base=lastCalc.base;
  if(profit<=0 || base<=0){
    document.getElementById('finalAmount').textContent='৳0';
    document.getElementById('profitDetail').textContent='';
    return;
  }
  var finalPrice=base + profit;
  var pct=((profit/base)*100).toFixed(1);
  document.getElementById('finalAmount').textContent='৳'+finalPrice.toLocaleString();
  document.getElementById('profitDetail').textContent='Profit: ৳'+profit.toLocaleString()+' ('+pct+'%)';
}

function resetForm(){
  document.getElementById('phoneInput').value='';
  document.getElementById('buyPrice').value='';
  document.getElementById('buyDate').valueAsDate = new Date();
  document.getElementById('officialType').value='unofficial';
  document.getElementById('warrantySection').style.display='none';
  document.getElementById('opened').value='0';
  document.getElementById('battery').value='0';
  document.getElementById('scratch').value='0';
  document.getElementById('camera').value='0';
  document.getElementById('display').value='0';
  document.getElementById('overall').value='1';
  document.getElementById('boxItem').value='0';
  document.getElementById('chargerItem').value='0';
  document.getElementById('result').classList.remove('show');
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
